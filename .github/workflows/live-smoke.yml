name: Live smoke test

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:00 UTC. Adjust or remove once monitoring lives elsewhere.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  live:
    name: Smoke test the deployed site
    runs-on: ubuntu-latest
    if: vars.LIVE_URL != ''
    env:
      LIVE_URL: ${{ vars.LIVE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=live
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-playwright-report
          path: playwright-report
          retention-days: 7
