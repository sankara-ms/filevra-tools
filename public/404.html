<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found - FormReady</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1f5fbf" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #f6f8fb;
        color: #2b3746;
      }
      .card {
        width: 100%;
        max-width: 36rem;
        background: #fff;
        border: 1px solid #dfe5ec;
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 18px 48px rgba(16, 24, 40, 0.08);
      }
      .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 1.1rem; color: #16202e; text-decoration: none; }
      .eyebrow { display: inline-block; margin-top: 1.5rem; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #1f5fbf; }
      h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 0.5rem 0 0.75rem; color: #16202e; }
      p { line-height: 1.65; margin: 0 0 1.25rem; color: #5d6b7d; }
      h2 { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: #5d6b7d; margin: 1.5rem 0 0.6rem; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; }
      li a { display: block; padding: 0.6rem 0.75rem; border: 1px solid #dfe5ec; border-radius: 10px; text-decoration: none; color: #16202e; font-weight: 550; }
      li a:hover { border-color: #1f5fbf; color: #1f5fbf; }
      .btn { display: inline-flex; padding: 0.6rem 1rem; border-radius: 10px; background: #1f5fbf; color: #fff; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="/">
        <svg width="32" height="32" viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="112" fill="#1f5fbf" />
          <path d="M150 120h150l76 76v180a28 28 0 0 1-28 28H150a28 28 0 0 1-28-28V148a28 28 0 0 1 28-28z" fill="#fff" />
          <path d="M186 250h124M186 300h92" stroke="#1f5fbf" stroke-width="22" stroke-linecap="round" />
          <circle cx="352" cy="352" r="74" fill="#1c7d54" />
          <path d="M316 352l25 25 46-50" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        FormReady

      <span class="eyebrow">404</span>
      <h1>Page not found</h1>
      <p>
        The address may be mistyped or the page may have moved. No file was processed. Choose a tool below, or return to
        the homepage.
      </p>
      <a class="btn" href="/">Go to the homepage</a>
      <h2>Tools</h2>
      <ul>
        <li><a href="/image-compressor">Image Compressor</a></li>

        <li><a href="/merge-pdf">PDF Merger</a></li>
        <li><a href="/compress-pdf">PDF Compressor</a></li>
      </ul>
    </main>
  </body>
</html>
